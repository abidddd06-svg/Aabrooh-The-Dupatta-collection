<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | AABROOH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
  .checkout-wrap { max-width: 720px; margin: 0 auto; padding: 50px 32px 100px; }
  .checkout-summary { background: var(--white); border-radius: var(--radius); padding: 26px; box-shadow: var(--shadow-soft); margin-bottom: 30px; }
  .checkout-summary h3 { font-size: 16px; margin-bottom: 18px; }
  .co-item { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--black-soft); padding: 10px 0; border-bottom: 1px solid var(--gold-soft); }
  .co-item:last-of-type { border-bottom: none; }
  .co-total { display: flex; justify-content: space-between; font-size: 16px; font-weight: 600; padding-top: 16px; margin-top: 6px; border-top: 1px solid var(--gold-soft); }
  .checkout-form { display: flex; flex-direction: column; gap: 16px; }
  .checkout-form input, .checkout-form textarea {
    padding: 15px 20px; border: 1px solid var(--gold-soft); border-radius: var(--radius-sm);
    background: var(--white); font-size: 13.5px; outline: none; transition: border-color var(--transition);
  }
  .checkout-form input:focus, .checkout-form textarea:focus { border-color: var(--gold); }
  .checkout-form textarea { resize: vertical; min-height: 90px; }
  .form-row { display: flex; gap: 14px; }
  .form-row input { flex: 1; }
  .empty-cart-msg { text-align: center; padding: 60px 20px; color: var(--black-soft); }
  .co-success { text-align: center; padding: 70px 20px; }
  .co-success .icon { font-size: 46px; margin-bottom: 20px; }
  .co-success h2 { margin-bottom: 12px; }
  .co-success p { color: var(--black-soft); font-size: 14px; max-width: 420px; margin: 0 auto 30px; }
  .secure-note { font-size: 12px; color: var(--black-soft); text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 4px; }
</style>
</head>
<body>

<div class="announce">Pan India Shipping · Not Just a Dupatta, A Statement of Grace</div>

<header class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="logo">AABR<span>OO</span>H</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="nav-icons">
      <button class="icon-btn" title="Cart" id="cartBtn">&#128092;<span class="badge cart-count">0</span></button>
    </div>
  </div>
</header>

<div class="breadcrumb"><a href="index.html">Home</a> / Checkout</div>

<section class="page-header">
  <span class="eyebrow">Almost There</span>
  <h1>Checkout</h1>
  <p>Enter your details and complete payment securely.</p>
</section>

<div class="checkout-wrap" id="checkoutWrap">
</div>

<footer class="footer">
  <div class="footer-grid">
    <div class="footer-col"><h4>Contact</h4><address>Instagram: @aabrooh.official<br>Phone: +91 73093 29960</address></div>
  </div>
  <div class="footer-bottom">&copy; 2026 AABROOH. All rights reserved.</div>
</footer>

<div class="toast" id="toast"></div>

<script src="products.js"></script>
<script src="main.js"></script>
<script>
  const FORM_ENDPOINT = "https://formspree.io/f/moeqjlpa";
  const PAYMENT_WORKER_URL = "https://aabroohpayment.abidddd06.workers.dev/";
  const RAZORPAY_KEY_ID = "rzp_live_TYq9CGLOTz1Bqv";

  let cartTotal = 0;
  let cartItemsText = "";

  function renderCheckout() {
    const cart = Store.getCart();
    const wrap = document.getElementById("checkoutWrap");

    if (cart.length === 0) {
      wrap.innerHTML = `
        <div class="empty-cart-msg">
          <p style="font-size:15px;margin-bottom:20px;">Your bag is empty — add a few dupattas before checking out.</p>
          <a href="shop.html" class="btn btn-primary">Go to Shop</a>
        </div>`;
      return;
    }

    let total = 0;
    let itemsHTML = "";
    let itemsPlainText = "";
    cart.forEach(item => {
      const p = PRODUCTS.find(pr => pr.id === item.id);
      if (!p) return;
      const lineTotal = p.price * item.qty;
      total += lineTotal;
      itemsHTML += `<div class="co-item"><span>${p.name} × ${item.qty}</span><span>₹${lineTotal}</span></div>`;
      itemsPlainText += `${p.name} x${item.qty} - ₹${lineTotal}\n`;
    });

    cartTotal = total;
    cartItemsText = itemsPlainText;

    wrap.innerHTML = `
      <div class="checkout-summary">
        <h3>Order Summary</h3>
        ${itemsHTML}
        <div class="co-total"><span>Total</span><span>₹${total}</span></div>
      </div>

      <form class="checkout-form" id="checkoutForm">
        <div class="form-row">
          <input type="text" id="custName" placeholder="Full Name" required>
          <input type="tel" id="custPhone" placeholder="Phone Number" required>
        </div>
        <input type="email" id="custEmail" placeholder="Email Address" required>
        <textarea id="custAddress" placeholder="Full Delivery Address (House no, Street, City, State)" required></textarea>
        <input type="text" id="custPincode" placeholder="Pincode" required>
        <textarea id="custNotes" placeholder="Any notes (optional)"></textarea>

        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Pay ₹${total} & Place Order</button>
        <p class="secure-note">&#128274; Secured by Razorpay</p>
      </form>
    `;

    document.getElementById("checkoutForm").addEventListener("submit", handlePayment);
  }

  async function handlePayment(e) {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Processing...";

    const name = document.getElementById("custName").value;
    const phone = document.getElementById("custPhone").value;
    const email = document.getElementById("custEmail").value;
    const address = document.getElementById("custAddress").value;
    const pincode = document.getElementById("custPincode").value;
    const notes = document.getElementById("custNotes").value;

    try {
      const orderRes = await fetch(PAYMENT_WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ amount: cartTotal })
      });
      const orderData = await orderRes.json();

      if (!orderData.order_id) throw new Error("Could not start payment");

      const options = {
        key: RAZORPAY_KEY_ID,
        amount: orderData.amount,
        currency: "INR",
        name: "AABROOH",
        description: "Order Payment",
        order_id: orderData.order_id,
        prefill: { name: name, email: email, contact: phone },
        theme: { color: "#1A1A1A" },
        handler: function (response) {
          const fd = new FormData();
          fd.append("Full Name", name);
          fd.append("Phone", phone);
          fd.append("Email", email);
          fd.append("Delivery Address", address);
          fd.append("Pincode", pincode);
          fd.append("Order Notes", notes);
          fd.append("Order Details", cartItemsText);
          fd.append("Order Total", `₹${cartTotal}`);
          fd.append("Payment ID", response.razorpay_payment_id);
          fd.append("_subject", `PAID Order - ₹${cartTotal} - ${name}`);
          fetch(FORM_ENDPOINT, { method: "POST", body: fd, headers: { "Accept": "application/json" } });

          Store.setCart([]);
          showSuccess();
        },
        modal: {
          ondismiss: function () {
            btn.disabled = false;
            btn.textContent = originalText;
          }
        }
      };

      const rzp = new Razorpay(options);
      rzp.open();
    } catch (err) {
      btn.disabled = false;
      btn.textContent = originalText;
      showToast("Something went wrong. Please try again.");
    }
  }

  function showSuccess() {
    document.getElementById("checkoutWrap").innerHTML = `
      <div class="co-success">
        <div class="icon">&#10004;&#65039;</div>
        <h2>Order Confirmed</h2>
        <p>Thank you for your payment! Your order has been placed successfully. We'll ship it soon and keep you updated.</p>
        <a href="index.html" class="btn btn-primary">Continue Shopping</a>
      </div>`;
  }

  document.addEventListener("DOMContentLoaded", renderCheckout);
</script>
</body>
</html>
